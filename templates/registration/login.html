{% extends "base.html" %}
{% load static %}
{% block titre %}Connexion{% endblock %}
{% block contenu %}
<div class="carte connexion">
  <img class="logo-login" src="{% static 'img/logo-fid.jpg' %}"
       alt="FID - Fonds d'Intervention pour le Développement, Madagascar">
  <h1> FID ☺</h1>
  <form method="post">{% csrf_token %}
    {% if form.errors %}<div class="msg error">Identifiant ou mot de passe incorrect.</div>{% endif %}
    <div class="champ"><label for="id_username">Identifiant</label>{{ form.username }}</div>
    <div class="champ"><label for="id_password">Mot de passe</label>{{ form.password }}</div>
    <button class="primaire">Se connecter</button>
  </form>
</div>
{% endblock %}
